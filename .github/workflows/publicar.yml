name: Testar e publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test site/sessao.test.js
      - run: node --test teste/nucleo.test.js
        working-directory: extensao

  publicar:
    if: github.event_name != 'pull_request'
    needs: testar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Empacotar a extensão para download
        working-directory: extensao
        run: zip -r ../site/sinal-aberto-extensao.zip . -x 'teste/*' 'gerar-*.js'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
